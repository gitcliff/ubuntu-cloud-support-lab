name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning

      - name: bats
        run: bats tools/tests

      - name: Smoke test the diag tool as root
        run: |
          out=$(sudo tools/ubuntu-diag.sh -q -o /tmp)
          tar -tzf "$out" | head -20
